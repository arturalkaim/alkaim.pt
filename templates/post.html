<!DOCTYPE html>
<!--
  Post template. To publish: copy to writing/<slug>.html, replace every {{…}},
  write the body inside <article>, then add a row to the "ls ~/writing" list in index.html.
  Served at https://alkaim.pt/writing/<slug>
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#10151a">
  <title>{{TITLE}} — Artur Alkaim</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="alternate" type="application/rss+xml" title="Artur Alkaim — writing" href="https://alkaim.pt/feed.xml">
  <link rel="canonical" href="https://alkaim.pt/writing/{{SLUG}}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://alkaim.pt/writing/{{SLUG}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="article:published_time" content="{{YYYY-MM-DD}}">
  <meta property="og:image" content="https://alkaim.pt/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Artur Alkaim — software engineer in Lisbon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@arturalkaim">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%2310151a'/%3E%3Crect%20x='4'%20y='4'%20width='5'%20height='8'%20fill='%23e2a13e'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #10151a;
      --card: #151b21;
      --line: #223039;
      --ink: #c8d3db;
      --bright: #e8eef3;
      --dim: #7d8c98;
      --amber: #e2a13e;
      --cyan: #58b7c3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 14.5px/1.75 "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--amber); color: var(--bg); }
    a { color: var(--cyan); }
    a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 2px; }

    .page { max-width: 760px; margin: 0 auto; padding: 72px 24px 64px; }

    /* header */
    .prompt { color: var(--dim); margin: 0 0 6px; font-size: 13px; }
    .prompt a { color: var(--cyan); text-decoration: none; }
    .prompt a:hover { text-decoration: underline; }
    h1 {
      font-size: clamp(24px, 4.5vw, 34px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      color: var(--bright);
    }
    .meta { color: var(--dim); font-size: 12.5px; margin: 0 0 48px; }

    /* article body */
    article { max-width: 68ch; }
    article h2, article h3 { color: var(--bright); font-weight: 600; line-height: 1.4; margin: 44px 0 12px; }
    article h2 { font-size: 17px; }
    article h2::before { content: "## "; color: var(--amber); }
    article h3 { font-size: 15px; }
    article h3::before { content: "### "; color: var(--amber); }
    article p { margin: 0 0 18px; }
    article strong { color: var(--bright); font-weight: 600; }
    article ul, article ol { padding-left: 24px; margin: 0 0 18px; }
    article li { margin-bottom: 6px; }
    article ul { list-style: none; }
    article ul li { position: relative; }
    article ul li::before { content: "-"; position: absolute; left: -16px; color: var(--amber); }
    article blockquote {
      margin: 0 0 18px;
      padding: 2px 0 2px 18px;
      border-left: 2px solid var(--amber);
      color: var(--dim);
    }
    article code {
      font: inherit;
      font-size: 13px;
      color: var(--bright);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
    }
    article pre {
      margin: 0 0 22px;
      padding: 14px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    article pre code { background: none; border: 0; padding: 0; color: var(--ink); }
    article img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
    article figure { margin: 0 0 22px; }
    article figcaption { color: var(--dim); font-size: 12px; margin-top: 6px; }
    article hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

    footer {
      margin-top: 72px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 24px;
    }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--amber); }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="prompt"><a href="/">artur@alkaim.pt</a> ~/writing % cat {{SLUG}}.md</p>
      <h1>{{TITLE}}</h1>
      <p class="meta"><time datetime="{{YYYY-MM-DD}}">{{YYYY-MM-DD}}</time> &middot; {{N}} min read</p>
    </header>

    <article>
      <p>{{Opening paragraph.}}</p>

      <h2>{{Section heading}}</h2>
      <p>{{Body text with <code>inline code</code> and a <a href="#">link</a>.}}</p>

      <pre><code>{{code block}}</code></pre>
    </article>

    <footer>
      <a href="/">&larr; cd ~</a>
      <span>Thoughts? <a href="mailto:artur@alkaim.pt">artur@alkaim.pt</a></span>
    </footer>
  </main>
</body>
</html>
